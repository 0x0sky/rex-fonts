name: Font license metadata

on:
  push:
    paths:
      - .github/workflows/font-license.yml
      - rexify.py
      - tools/font_metadata.py
      - tools/normalize_font_metadata.py
      - tools/verify_font_metadata.py
      - tools/verify_font_delta.py
      - out/stix2/rex-stix2.otf
      - README.md
      - LICENSES.md
      - FONTLOG.md
  pull_request:
    paths:
      - .github/workflows/font-license.yml
      - rexify.py
      - tools/font_metadata.py
      - tools/normalize_font_metadata.py
      - tools/verify_font_metadata.py
      - tools/verify_font_delta.py
      - out/stix2/rex-stix2.otf
      - README.md
      - LICENSES.md
      - FONTLOG.md

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Check Python syntax
        run: |
          python -m py_compile \
            rexify.py \
            tools/font_metadata.py \
            tools/normalize_font_metadata.py \
            tools/verify_font_metadata.py \
            tools/verify_font_delta.py

      - name: Verify committed STIX2 metadata
        run: python -m tools.verify_font_metadata out/stix2/rex-stix2.otf

      - name: Verify normalization is idempotent
        run: |
          mkdir -p /tmp/rex-fonts
          cp out/stix2/rex-stix2.otf /tmp/rex-fonts/rex-stix2.otf
          python -m tools.normalize_font_metadata /tmp/rex-fonts/rex-stix2.otf
          cmp out/stix2/rex-stix2.otf /tmp/rex-fonts/rex-stix2.otf

      - name: Verify cleanup touched metadata only
        run: |
          git fetch origin master:refs/remotes/origin/master --depth=1
          git show origin/master:out/stix2/rex-stix2.otf > /tmp/rex-fonts/rex-stix2-before.otf
          python -m tools.verify_font_delta \
            /tmp/rex-fonts/rex-stix2-before.otf \
            out/stix2/rex-stix2.otf
