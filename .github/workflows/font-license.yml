name: Font license metadata

on:
  push:
    branches:
      - feature/stix2-ofl-compliance
    paths:
      - .github/workflows/font-license.yml
      - rexify.py
      - tools/font_metadata.py
      - tools/normalize_font_metadata.py
      - tools/verify_font_metadata.py

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: python -m pip install --disable-pip-version-check fonttools

      - name: Check Python syntax
        run: |
          python -m py_compile \
            rexify.py \
            tools/font_metadata.py \
            tools/normalize_font_metadata.py \
            tools/verify_font_metadata.py

      - name: Normalize generated STIX2 metadata
        run: |
          python -m tools.normalize_font_metadata out/stix2/rex-stix2.otf
          python -m tools.verify_font_metadata out/stix2/rex-stix2.otf

      - name: Commit normalized font artifact
        shell: bash
        run: |
          if git diff --quiet -- out/stix2/rex-stix2.otf; then
            echo "Generated STIX2 artifact already has compliant metadata."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/stix2/rex-stix2.otf
          git commit -m "font: normalize STIX2 derivative metadata"
          git push
